<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책 순위·재고 대시보드</title>
<meta name="description" content="교보문고·예스24 순위, 판매지수, 매장별 재고 변화를 매일 아침 자동 수집해 보여 주는 대시보드">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --good: #006300; --bad: #d03b3b; --warn: #fab219;
    --chip: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --good: #0ca30c; --bad: #e66767; --chip: #383835;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .sub a { color: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 20px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; cursor: pointer; font: inherit; }
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); font-weight: 600; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .k { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
  .tile .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .tile .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .tile .d { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .note { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .plot { position: relative; height: 240px; }
  .full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  tr.zero td { color: var(--muted); }
  .tscroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .bar { display: inline-block; height: 10px; background: var(--s1); border-radius: 0 3px 3px 0; vertical-align: middle; margin-right: 6px; }
  .area { display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--chip); border-radius: 6px; padding: 1px 6px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { .plot { height: 200px; } h1 { font-size: 19px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">책 순위·재고 대시보드</h1>
      <div class="sub" id="meta">불러오는 중…</div>
    </div>
  </header>

  <div class="controls">
    <select id="bookSel" hidden></select>
    <div class="seg" id="range" role="group" aria-label="기간">
      <button data-h="168">7일</button>
      <button data-h="720" aria-pressed="true">30일</button>
      <button data-h="2160">90일</button>
      <button data-h="0">전체</button>
    </div>
    <span class="sub" id="count"></span>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="cards">
    <div class="card">
      <h2>순위 추이</h2>
      <div class="note">위쪽이 높은 순위. 예스24 순위는 판매지수가 충분할 때만 표시됩니다.</div>
      <div class="plot"><canvas id="cRank"></canvas></div>
    </div>
    <div class="card">
      <h2>예스24 판매지수 추이</h2>
      <div class="note">예스24가 판매량·최근성을 반영해 산출하는 지수</div>
      <div class="plot"><canvas id="cSales"></canvas></div>
    </div>
    <div class="card full">
      <h2>교보문고 재고 추이</h2>
      <div class="note">매장 재고 합계와 온라인(물류) 재고. 줄어든 만큼 팔렸다고 볼 수 있습니다.</div>
      <div class="plot"><canvas id="cStock"></canvas></div>
    </div>
    <div class="card full">
      <h2>교보문고 매장별 재고</h2>
      <div class="note" id="storeNote"></div>
      <div class="tscroll"><table id="storeTbl"></table></div>
    </div>
  </div>

  <footer>매일 07:00(한국 시간) GitHub Actions가 교보문고·예스24 공개 페이지를 조회해 기록합니다. 원본 데이터: <a href="data/history.jsonl">history.jsonl</a></footer>
</div>

<script>
(async function () {
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const fmt = n => (n == null ? '–' : Number(n).toLocaleString('ko-KR'));
  const pad = n => String(n).padStart(2, '0');
  const tLabel = d => `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}시`;
  const tFull = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  const bust = `?v=${Date.now()}`;
  const [books, storesMeta, histText] = await Promise.all([
    fetch('books.json' + bust).then(r => r.json()),
    fetch('data/stores.json' + bust).then(r => r.ok ? r.json() : {}),
    fetch('data/history.jsonl' + bust).then(r => r.ok ? r.text() : ''),
  ]);
  const history = histText.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } })
    .filter(Boolean).map(s => ({ ...s, d: new Date(s.t) })).sort((a, b) => a.d - b.d);

  // ---- 책 선택
  const sel = document.getElementById('bookSel');
  books.forEach(b => { const o = document.createElement('option'); o.value = b.id; o.textContent = b.title; sel.appendChild(o); });
  sel.hidden = books.length < 2;
  let bookId = (location.hash.slice(1) && books.find(b => b.id === location.hash.slice(1))) ? location.hash.slice(1) : books[0].id;
  sel.value = bookId;
  let hours = 720;

  sel.addEventListener('change', () => { bookId = sel.value; location.hash = bookId; render(); });
  document.querySelectorAll('#range button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#range button').forEach(x => x.setAttribute('aria-pressed', x === b));
    hours = Number(b.dataset.h); render();
  }));

  // ---- 차트 공통
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = css('--muted');
  const charts = {};
  const baseOpts = (yOpts = {}) => ({
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    elements: { line: { borderWidth: 2, tension: 0.15 }, point: { radius: 0, hoverRadius: 5, hitRadius: 12 } },
    plugins: {
      legend: { display: true, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', color: css('--ink-2') } },
      tooltip: { backgroundColor: css('--surface'), titleColor: css('--ink'), bodyColor: css('--ink-2'), borderColor: css('--border'), borderWidth: 1,
                 callbacks: { title: items => items.length ? tFull(items[0].raw.x) : '', label: c => ` ${c.dataset.label}: ${fmt(c.raw.y)}${c.dataset.unit || ''}` } },
    },
    scales: {
      x: { type: 'category', grid: { display: false }, border: { color: css('--axis') },
           ticks: { maxRotation: 0, autoSkip: true, autoSkipPadding: 24, maxTicksLimit: 6 } },
      y: { grid: { color: css('--grid') }, border: { display: false }, ticks: { precision: 0, callback: v => fmt(v) }, ...yOpts },
    },
  });
  const crosshair = {
    id: 'crosshair',
    afterDraw(chart) {
      const a = chart.tooltip?.getActiveElements?.() || [];
      if (!a.length) return;
      const { ctx, chartArea: { top, bottom } } = chart; const x = a[0].element.x;
      ctx.save(); ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
    },
  };
  function draw(id, labels, datasets, yOpts) {
    const ctx = document.getElementById(id);
    if (charts[id]) charts[id].destroy();
    const opts = baseOpts(yOpts);
    opts.plugins.legend.display = datasets.length > 1;
    charts[id] = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: opts, plugins: [crosshair] });
  }
  const series = (label, color, points, unit, extra = {}) => ({
    label, unit, data: points, borderColor: color, backgroundColor: color, pointBackgroundColor: color, spanGaps: true, ...extra,
  });

  // ---- 렌더
  function render() {
    const book = books.find(b => b.id === bookId);
    const all = history.filter(s => s.book === bookId);
    const now = all.length ? all[all.length - 1].d : new Date();
    const rows = hours ? all.filter(s => now - s.d <= hours * 3600e3) : all;
    const last = all[all.length - 1];

    document.getElementById('title').textContent = `${book.title} · 순위·재고 대시보드`;
    document.getElementById('meta').innerHTML = last
      ? `${book.author || ''} · ${book.publisher || ''} · 출간 ${book.pubDate || ''} · 마지막 수집 <b>${tFull(last.d)}</b> · `
        + `<a href="https://product.kyobobook.co.kr/detail/${book.kyobo}" target="_blank" rel="noopener">교보문고</a> · `
        + `<a href="https://www.yes24.com/product/goods/${book.yes24}" target="_blank" rel="noopener">예스24</a>`
        + `<br>리뷰 교보 ${fmt(last.kyobo?.reviewCount)}건${last.kyobo?.reviewScore != null ? ` (평점 ${last.kyobo.reviewScore})` : ''} · 예스24 ${fmt(last.yes24?.reviewCount)}건${last.yes24?.reviewScore != null ? ` (평점 ${last.yes24.reviewScore})` : ''} · 판매가 ${fmt(last.kyobo?.price)}원`
      : '아직 수집된 데이터가 없습니다.';
    document.getElementById('count').textContent = rows.length ? `스냅샷 ${rows.length}건 (${tFull(rows[0].d)} ~ ${tFull(rows[rows.length - 1].d)})` : '';

    if (!last) {
      document.getElementById('tiles').innerHTML = '';
      document.getElementById('storeTbl').innerHTML = '<tr><td class="empty">데이터 없음</td></tr>';
      return;
    }

    // 비교 기준: 하루 전 스냅샷(없으면 가장 오래된 것)
    const ago = all.filter(s => now - s.d >= 24 * 3600e3);
    const ref = ago.length ? ago[ago.length - 1] : all[0];
    const refIsSame = ref === last;
    const refLabel = ago.length ? '전일 대비' : '첫 수집 대비';

    const kRank = s => s.kyobo?.rank?.[0]?.rank ?? null;
    const yRank = s => s.yes24?.rank?.[0]?.rank ?? null;
    const kRankLabel = last.kyobo?.rank?.[0]?.label || '주간베스트';
    const yRankLabel = last.yes24?.rank?.[0]?.label || '';
    const sold = all.length ? soldEstimate(all) : 0;

    const delta = (cur, prev, opt = {}) => {
      if (cur == null || prev == null || refIsSame) return `<span>비교 기준 없음</span>`;
      const d = cur - prev; if (d === 0) return `<span>변동 없음 <small>(${refLabel})</small></span>`;
      if (opt.neutral) return `<span>${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}${opt.unit || ''} <small>(${refLabel})</small></span>`;
      const good = opt.lowerIsBetter ? d < 0 : d > 0;
      return `<span class="${good ? 'up' : 'down'}">${good ? '▲' : '▼'} ${fmt(Math.abs(d))}${opt.unit || ''} <small>(${refLabel})</small></span>`;
    };
    const tile = (k, v, unit, d) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ''}</div><div class="d">${d || ''}</div></div>`;
    document.getElementById('tiles').innerHTML = [
      tile(`교보 주간베스트 · ${kRankLabel}`, fmt(kRank(last)), kRank(last) != null ? '위' : '', delta(kRank(last), kRank(ref), { lowerIsBetter: true, unit: '계단' })),
      tile('예스24 판매지수', fmt(last.yes24?.salesIndex), '', delta(last.yes24?.salesIndex, ref.yes24?.salesIndex)),
      tile(`예스24 베스트${yRankLabel ? ' · ' + yRankLabel : ''}`, yRank(last) != null ? fmt(yRank(last)) : '순위권 밖', yRank(last) != null ? '위' : '', yRank(last) != null ? delta(yRank(last), yRank(ref), { lowerIsBetter: true, unit: '계단' }) : '판매지수가 오르면 표시됩니다'),
      tile('교보 매장 재고 합계', fmt(last.kyobo?.storeTotal), '권', delta(last.kyobo?.storeTotal, ref.kyobo?.storeTotal, { unit: '권', neutral: true })),
      tile('교보 온라인 재고', fmt(last.kyobo?.online), '권', delta(last.kyobo?.online, ref.kyobo?.online, { unit: '권', neutral: true })),
      tile('매장 판매 추정(누적)', fmt(sold), '권', `수집 시작 이후 매장 재고 감소분 합계`),
    ].join('');

    // ---- 차트
    const labels = rows.map(s => tLabel(s.d));
    const pt = (s, v) => ({ x: s.d, y: v });
    draw('cRank', labels, [
      series(`교보 ${kRankLabel}`, css('--s1'), rows.map(s => pt(s, kRank(s))), '위'),
      series(`예스24 ${yRankLabel || '베스트'}`, css('--s2'), rows.map(s => pt(s, yRank(s))), '위'),
    ], { reverse: true, ticks: { precision: 0, callback: v => fmt(v) + '위' } });
    draw('cSales', labels, [
      series('판매지수', css('--s2'), rows.map(s => pt(s, s.yes24?.salesIndex ?? null)), ''),
    ], { beginAtZero: false });
    draw('cStock', labels, [
      series('매장 합계', css('--s1'), rows.map(s => pt(s, s.kyobo?.storeTotal ?? null)), '권'),
      series('온라인', css('--s3'), rows.map(s => pt(s, s.kyobo?.online ?? null)), '권'),
    ], { beginAtZero: true });

    // ---- 매장 표
    const stores = last.kyobo?.stores || {};
    const prevStores = ref.kyobo?.stores || {};
    const first = all.find(s => s.kyobo?.stores)?.kyobo?.stores || {};
    const codes = Object.keys(stores);
    const max = Math.max(1, ...codes.map(c => stores[c] || 0));
    const soldByStore = soldEstimateByStore(all);
    const list = codes.map(c => ({
      code: c, name: storesMeta[c]?.name || c, area: storesMeta[c]?.area || '', addr: storesMeta[c]?.addr || '',
      cur: stores[c] ?? 0, prev: prevStores[c], start: first[c], sold: soldByStore[c] || 0,
    })).sort((a, b) => b.cur - a.cur || b.sold - a.sold || a.name.localeCompare(b.name, 'ko'));
    const inStock = list.filter(s => s.cur > 0).length;
    document.getElementById('storeNote').textContent = `${codes.length}개 매장 중 ${inStock}곳 재고 보유 · ${refLabel} 변화와 수집 시작 이후 감소분(판매 추정)`;
    const dcell = (cur, prev) => {
      if (prev == null || refIsSame) return '<td>–</td>';
      const d = cur - prev; if (!d) return '<td>0</td>';
      return `<td class="${d < 0 ? 'down' : 'up'}">${d > 0 ? '+' : ''}${d}</td>`;
    };
    document.getElementById('storeTbl').innerHTML =
      `<thead><tr><th class="l">매장</th><th class="l">지역</th><th>현재 재고</th><th>${refLabel}</th><th>시작 시점</th><th>판매 추정</th></tr></thead><tbody>` +
      list.map(s => `<tr class="${s.cur ? '' : 'zero'}"><td class="l" title="${s.addr}">${s.name}</td><td class="l"><span class="area">${s.area}</span></td>` +
        `<td><span class="bar" style="width:${Math.round(60 * s.cur / max)}px"></span>${s.cur}</td>${dcell(s.cur, s.prev)}<td>${s.start ?? '–'}</td><td>${s.sold || 0}</td></tr>`).join('') +
      '</tbody>';
  }

  // 연속 스냅샷 사이의 매장별 재고 감소분을 합산한다(입고는 무시).
  function soldEstimateByStore(all) {
    const out = {}; let prev = null;
    for (const s of all) {
      const st = s.kyobo?.stores; if (!st) continue;
      if (prev) for (const c in st) { const d = (prev[c] ?? st[c]) - st[c]; if (d > 0) out[c] = (out[c] || 0) + d; }
      prev = st;
    }
    return out;
  }
  function soldEstimate(all) { return Object.values(soldEstimateByStore(all)).reduce((a, b) => a + b, 0); }

  render();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { Chart.defaults.color = css('--muted'); render(); });
})();
</script>
</body>
</html>
